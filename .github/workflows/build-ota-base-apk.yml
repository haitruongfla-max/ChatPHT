name: Build ChatPHT OTA Base APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag cho APK nền OTA"
        required: true
        default: "v1.0.34-github-auto-update-fix-vc38"

# GitHub Release cần quyền ghi nội dung; workflow không sử dụng Expo cloud build.
permissions:
  contents: write

jobs:
  build-ota-base-apk:
    name: Build OTA base APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      APK_OUTPUT: ./app-release.apk
      # Expo Android build dùng một worker để không vượt bộ nhớ runner GitHub tiêu chuẩn.
      # Chạy một worker để không vượt bộ nhớ runner GitHub tiêu chuẩn.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3g
        -Dorg.gradle.workers.max=1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          fi
          test -s google-services.json || {
            echo "::error::Thiếu Google Services JSON. Hãy đặt GitHub secret GOOGLE_SERVICES_JSON_BASE64.";
            exit 1;
          }

      - name: Verify Expo credentials access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::Thiếu GitHub secret EXPO_TOKEN có quyền truy cập project Expo ChatPHT.";
            exit 1;
          }

      - name: Build signed Android APK locally
        run: >-
          npx eas-cli@latest build --local --non-interactive --platform android
          --profile ota-base-apk --output "$APK_OUTPUT"

      - name: Derive immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          short_sha="${GITHUB_SHA:0:8}"
          release_id="CPHT-${tag#v}-${short_sha}"
          asset_name="ChatPHT-${release_id}.apk"
          asset_file="./${asset_name}"
          checksum_name="${asset_name}.sha256"
          checksum_file="./${checksum_name}"
          cp "$APK_OUTPUT" "$asset_file"
          sha256sum "$asset_file" | awk -v asset="$asset_name" '{print $1 "  " asset}' > "$checksum_file"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_file=$asset_file" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$checksum_name" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPHT-${{ steps.release_identity.outputs.release_id }}
          path: |
            ${{ steps.release_identity.outputs.asset_file }}
            ${{ steps.release_identity.outputs.checksum_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_FILE: ${{ steps.release_identity.outputs.asset_file }}
          RELEASE_ID: ${{ steps.release_identity.outputs.release_id }}
          ASSET_NAME: ${{ steps.release_identity.outputs.asset_name }}
          CHECKSUM_NAME: ${{ steps.release_identity.outputs.checksum_name }}
          CHECKSUM_FILE: ${{ steps.release_identity.outputs.checksum_file }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" app-release.apk --yes >/dev/null 2>&1 || true
            gh release upload "$RELEASE_TAG" "$ASSET_FILE" "$CHECKSUM_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_FILE" "$CHECKSUM_FILE" \
              --title "ChatPHT $RELEASE_ID" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
